name: slice-writes

# Each game-state slice's private fields are touched only by the system that
# owns it (ADR-0003, registry pattern direct_cross_system_state_write).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-slice-writes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test of the check
        run: bash tests/unit/ci/test_check_slice_writes.sh
      - name: Slices written only by their owner
        run: bash tools/ci/check-slice-writes.sh src tests
