# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: save_file_format
    status: active
    api: "enveloppe binaire à préfixe figé (marque, version d'enveloppe, longueur, schéma de contenu, révision) + charge utile + SHA-256 (HashingContext) ; quatre fichiers sous user:// ; écriture *.tmp → relecture vérifiée → rotation → renommage via FileStore ; chargement courant puis .bak seulement"
    not: "JSON ou ConfigFile en sauvegarde de production, ResourceSaver, CRC32 maison, promotion d'un .tmp, FileAccess ou DirAccess hors FileStore, écriture sur un autre fil sans amendement"
    adr: docs/architecture/adr-0006-sauvegarde.md
    reason: "Mesuré : var_to_bytes seul accepte 23 % des octets altérés ; rename supprime la cible avant de déplacer sur Windows ; SHA-256 46 µs pour 8 Ko"
    referenced_by:
      - docs/architecture/adr-0006-sauvegarde.md
    added: 2026-10-30
    revised: ""

  - purpose: game_state_representation
    status: active
    api: "colonnes PackedInt32Array / PackedByteArray (PackedInt64Array pour l'en-tête), duplicate() par colonne, var_to_bytes sans objets (charge utile seule ; enveloppe et empreinte : ADR-0006)"
    not: "objets RefCounted par entité, Dictionary / Array imbriqués, Resource, JSON en sauvegarde de production, bytes_to_var_with_objects"
    adr: docs/architecture/adr-0003-etat-de-partie.md
    reason: "Mesuré : copie 15 µs contre 284 µs (Dictionary) et 711 µs (objets), aller-retour var 59 µs ; var_to_bytes seul accepte 23 % des corruptions d'un octet"
    referenced_by:
      - docs/architecture/adr-0003-etat-de-partie.md
    added: 2026-10-30
    revised: ""

  - purpose: tile_wave_animation
    status: active
    api: "MultiMeshInstance2D + shader canvas_item + uniforme global g_time + WaveScheduler (GDScript pur)"
    not: "TIME, Time.get_ticks_msec() pour les instants de début, Tween ou nœud par tuile"
    adr: docs/architecture/adr-0001-rendu-des-tuiles.md
    reason: "Un dessin pour la carte, écriture seulement au changement d'état, tests déterministes avec un temps injecté"
    referenced_by:
      - docs/architecture/adr-0001-rendu-des-tuiles.md
    added: 2026-10-30
    revised: ""


