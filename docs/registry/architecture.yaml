# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: color_event_to_renderer
    status: active
    pattern: direct_call
    producer: presentation-sequencer
    consumers:
      - tile-renderer
    adr: docs/architecture/adr-0001-rendu-des-tuiles.md
    signal_signature: "TileRendererHandler.handle(event, ctx) -> PresentationHold appelle TileRenderer.apply_color_event(event: ColorTilesChanged, t0: float) -> int (durée de l'onde en ms, 0 si affichage direct) ; signal wave_finished(event_id: Vector2i) réservé aux tests"
    referenced_by:
      - docs/architecture/adr-0001-rendu-des-tuiles.md
      - docs/architecture/adr-0002-evenements-de-presentation.md
    added: 2026-10-30
    revised: 2026-10-30   # ancien motif : signal

  - contract: ai_turn_handoff
    status: active
    pattern: direct_call
    producer: turns-system
    consumers:
      - ai-runner
    adr: docs/architecture/adr-0005-ia-ennemie.md
    signal_signature: "AiRunner.start_turn(state, pipeline, pacing: PacingGate) ; rappel injecté on_turn_finished: Callable ; PacingGate.is_ready() -> bool (port Core, adaptateur de présentation, version factice pour les tests)"
    referenced_by:
      - docs/architecture/adr-0005-ia-ennemie.md
    added: 2026-10-30
    revised: ""

  - contract: command_submission
    status: active
    pattern: direct_call
    producer: controls-ai-turns
    consumers:
      - command-pipeline
    adr: docs/architecture/adr-0004-pipeline-de-commandes.md
    signal_signature: "CommandPipeline.submit(command) -> ValidationResult ; check(command) -> ValidationResult ; preview(command) -> PreviewResult ; apply_on(copy, command, collector) -> ValidationResult"
    referenced_by:
      - docs/architecture/adr-0004-pipeline-de-commandes.md
    added: 2026-10-30
    revised: ""

  - contract: event_batch_delivery
    status: active
    pattern: direct_call
    producer: command-pipeline
    consumers:
      - presentation-sequencer
    adr: docs/architecture/adr-0002-evenements-de-presentation.md
    signal_signature: "EventSink.push(batch: EventBatch) ; EventQueue.pop() -> EventBatch (null si vide) ; NullSink pour le rejeu ; les simulations n'appellent pas le pipeline"
    referenced_by:
      - docs/architecture/adr-0002-evenements-de-presentation.md
    added: 2026-10-30
    revised: ""

  - contract: presentation_handler
    status: active
    pattern: direct_call
    producer: presentation-sequencer
    consumers:
      - tile-renderer-handler
      - hud-presenter
      - audio-presenter
    adr: docs/architecture/adr-0002-evenements-de-presentation.md
    signal_signature: "handle(event, ctx) -> PresentationHold ; handle_merged(events, ctx) -> PresentationHold ; on_idle(view: StateView) ; rebuild_from_state(view: StateView)"
    referenced_by:
      - docs/architecture/adr-0002-evenements-de-presentation.md
      - docs/architecture/adr-0001-rendu-des-tuiles.md
    added: 2026-10-30
    revised: ""


