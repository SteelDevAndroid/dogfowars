    adr: docs/architecture/adr-0002-evenements-de-presentation.md
    interface: "PresentationClock.current() (secondes, pausable, avancée par _process(delta), jamais sauvegardée) ; TileTimeSource écrit g_time depuis l'horloge ; jamais global_shader_parameter_get ni create_timer"
