    status: active
    owner_system: tile-renderer
    adr: docs/architecture/adr-0001-rendu-des-tuiles.md
    interface: "8 canaux par instance du MultiMesh (custom data x,y,z,w : shown, previous, fog, start ; color r,g,b,a : s0, dur, fog_start, fog_prev), miroir CPU PackedFloat32Array de WaveScheduler"
    write_access: tile-renderer-only
    referenced_by:
      - docs/architecture/adr-0001-rendu-des-tuiles.md
    added: 2026-10-30
    revised: ""

  - state: presentation_time
