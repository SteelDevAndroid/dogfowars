  - pattern: event_broadcast_by_signal
    status: active
    description: "Les événements de présentation ne sont jamais distribués par des signaux Godot : le séquenceur appelle explicitement les gestionnaires dans un ordre fixe."
    why: "L'ordre d'appel des signaux n'est pas sourcé et un signal émis depuis son gestionnaire s'exécute en récursion synchrone (mesuré, profondeur 3)."
    adr: docs/architecture/adr-0002-evenements-de-presentation.md
    added: 2026-10-30

  - pattern: autoload_event_bus
    status: active
    description: "Aucun bus d'événements en autoload global : le pipeline reçoit un EventSink injecté."
    why: "Couplage caché, tests impossibles sans le singleton, ordre de chargement."
    adr: docs/architecture/adr-0002-evenements-de-presentation.md
    added: 2026-10-30

  - pattern: handler_emits_command
    status: active
    description: "Un gestionnaire de présentation n'émet jamais de commande ni n'écrit d'état de jeu."
    why: "Règle 11 du GDD 23 ; l'état est final à la publication et perdre la file ne change pas la partie."
    adr: docs/architecture/adr-0002-evenements-de-presentation.md
    added: 2026-10-30

  - pattern: await_or_create_timer_in_sequencer
    status: active
    description: "Le séquenceur n'utilise ni await ni get_tree().create_timer : il avance par _process et PresentationClock."
    why: "create_timer continue en pause ; un await en attente d'un signal jamais émis n'est pas libéré par un jeton (mesuré)."
    adr: docs/architecture/adr-0002-evenements-de-presentation.md
    added: 2026-10-30

  - pattern: direct_cross_system_state_write
    status: active
    description: "Un système n'écrit jamais la colonne ou la tranche d'un autre système : il appelle la fonction d'écriture du propriétaire."
    why: "Règle 2 du GDD 1 ; GDScript n'a pas de contrôle d'accès : convention vérifiée par une règle grep en CI (champs préfixés _), pas garantie par le langage."
    adr: docs/architecture/adr-0003-etat-de-partie.md
    added: 2026-10-30

  - pattern: dictionary_iteration_in_game_rule
    status: active
    description: "Une règle de jeu ne parcourt jamais un Dictionary : elle parcourt les colonnes par id croissant."
    why: "L'ordre d'itération est observé comme celui d'insertion mais non garanti par la référence du moteur (règle 8 du GDD 1)."
    adr: docs/architecture/adr-0003-etat-de-partie.md
    added: 2026-10-30

  - pattern: engine_randomness_in_game_state
    status: active
    description: "Aucun hasard du moteur dans l'état ni dans les règles : tout tirage passe par la fonction de l'état (graine et compteur)."
    why: "Reproductibilité et rejeu (règle 7 du GDD 1)."
    adr: docs/architecture/adr-0003-etat-de-partie.md
    added: 2026-10-30

  - pattern: object_in_game_state
    status: active
    description: "L'état ne contient ni Node, ni Object, ni Callable, ni RID, ni Resource créée à l'exécution, ni Dictionary non typé."
    why: "Règle 4 du GDD 1 ; var_to_bytes perd les objets ; copie coûteuse."
    adr: docs/architecture/adr-0003-etat-de-partie.md
    added: 2026-10-30

  - pattern: logic_in_command
    status: active
    description: "Une commande est une donnée pure : aucune logique ni référence à un objet du moteur ; la logique est dans les handlers par système."
    why: "Règle 17 du GDD 23 : sérialisable sans perte et rejouable."
    adr: docs/architecture/adr-0004-pipeline-de-commandes.md
    added: 2026-10-30

  - pattern: validate_writes_state
    status: active
    description: "validate ne lit que la vue de la faction et n'écrit jamais."
    why: "La validation est complète et l'application ne peut pas échouer ; un refus ne révèle rien de caché."
    adr: docs/architecture/adr-0004-pipeline-de-commandes.md
    added: 2026-10-30

  - pattern: nested_submit_in_apply
    status: active
    description: "apply n'émet jamais de commande ni n'appelle submit ; l'enchaînement des tours est porté par le système des tours."
    why: "Un submit imbriqué ferait appliquer deux fois au rejeu et casse une révision par commande."
    adr: docs/architecture/adr-0004-pipeline-de-commandes.md
    added: 2026-10-30

  - pattern: ai_state_outside_state
    status: active
    description: "Aucun état d'IA (rôle, piste, siège, poste) hors des tranches de l'état : ni dans un Node, ni dans un script d'unité, ni dans une variable globale ; l'état du runner et AiBudget sont transitoires et jamais sauvegardés."
    why: "Copie, sauvegarde et rejeu emportent l'état ; le tour d'IA est rejoué depuis le début de la phase."
    adr: docs/architecture/adr-0005-ia-ennemie.md
    added: 2026-10-30

  - pattern: runner_saves_or_references_presentation
    status: active
    description: "Le runner d'IA ne déclenche jamais de sauvegarde et ne référence aucune classe de Presentation ; il passe par PacingGate."
    why: "Aucune sauvegarde pendant la phase ennemie (GDD 16, règle 9) ; sens de dépendance Core vers Presentation (ADR-0002)."
    adr: docs/architecture/adr-0005-ia-ennemie.md
    added: 2026-10-30

  - pattern: file_access_outside_filestore
    status: active
    description: "FileAccess et DirAccess ne sont appelés que dans l'implémentation réelle de FileStore."
    why: "Les pannes doivent pouvoir être injectées à chaque étape ; un seul écrivain en série."
    adr: docs/architecture/adr-0006-sauvegarde.md
    added: 2026-10-30

  - pattern: ai_decision_outside_state
    status: active
    description: "Le prochain coup de l'IA se décide à partir de l'état seul (agents, intentions, pistes, curseur_ia, drapeaux d'unités) ; la partie est sauvegardée après chaque commande de l'IA et la phase reprend à la commande suivante."
    why: "Décision du 2026-10-30 (PR #3, GDD 16 règle 9) : un arrêt en plein tour d'IA ne perd au plus que la commande en cours."
    adr: docs/architecture/adr-0006-sauvegarde.md
    added: 2026-10-30

  - pattern: promote_tmp_file
    status: active
    description: "Un fichier .tmp n'est jamais promu en fichier courant au chargement, même valide ; les .tmp restants sont supprimés."
    why: "Une partie abandonnée ne doit pas ressusciter après un arrêt entre deux suppressions."
    adr: docs/architecture/adr-0006-sauvegarde.md
    added: 2026-10-30

