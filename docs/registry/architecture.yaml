# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: per_tile_node_or_material
    status: active
    description: "Un nœud, un matériau ou un uniforme d'instance par tuile de carte est interdit : les tuiles sont rendues par un seul MultiMeshInstance2D."
    why: "Coût d'appels de dessin et d'animation non mesuré, état d'animation réparti qui complique la règle 15 et la reconstruction."
    adr: docs/architecture/adr-0001-rendu-des-tuiles.md
    added: 2026-10-30

  - pattern: shader_reads_game_state
    status: active
    description: "Le shader des tuiles ne lit que les huit canaux d'instance, pal et g_time."
    why: "Garde la présentation reconstruisible depuis l'état et le shader sans règle de jeu."
    adr: docs/architecture/adr-0001-rendu-des-tuiles.md
    added: 2026-10-30

  - pattern: renderer_writes_game_state
    status: active
    description: "Le moteur de rendu des tuiles n'écrit jamais d'état de jeu."
    why: "Respecte la règle 2 de design/gdd/hud-systeme.md et la séparation logique/présentation."
    adr: docs/architecture/adr-0001-rendu-des-tuiles.md
    added: 2026-10-30

  - pattern: global_shader_parameter_get_in_game
    status: active
    description: "global_shader_parameter_get n'est jamais appelé en jeu ni dans les tests ; lire la valeur côté TileTimeSource."
    why: "Erreur moteur observée en 4.7.2 (fonction réservée à l'éditeur, coûteuse)."
    adr: docs/architecture/adr-0001-rendu-des-tuiles.md
    added: 2026-10-30


