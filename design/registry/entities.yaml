# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: tile_index
    status: active
    source: design/gdd/modele-etat-partie.md
    referenced_by:
      - design/gdd/modele-etat-partie.md
    variables:
      - x
      - y
      - W
    output_range: [0, 255]
    expression: "y * W + x"
    notes: "Out-of-bounds coordinates are refused, never clamped."
    added: 2026-10-29
    revised: ""
  - name: screen_to_tile
    status: active
    source: design/gdd/controles-tactiles-camera.md
    referenced_by:
      - design/gdd/controles-tactiles-camera.md
    variables:
      - c
      - rc
      - s
      - tile_pt
    output_range: [-inf, inf]
    expression: "(floori(w.x), floori(w.y)) with w = c + (s - rc) / tile_pt"
    notes: "Presentation float math; yields integer (x, y) for commands. floori, never int(). Outside [0,W)x[0,H) is an empty background, never clamped (like tile_index)."
    added: 2026-10-30
    revised: ""
  - name: modifier_pv
    status: active
    source: design/gdd/unites-drones.md
    referenced_by:
      - design/gdd/unites-drones.md
      - design/gdd/combat.md
    variables:
      - pv_avant
      - delta
      - PV_max
    output_range: [0, 14]
    expression: "pv_apres = clamp(pv_avant + delta, 0, PV_max); detruite = (pv_apres = 0) and (pv_avant > 0)"
    notes: "Only HP write path (6). Combat (8) computes delta; rest heal passes a positive delta."
    added: 2026-10-30
    revised: ""
  - name: revenu
    status: active
    source: design/gdd/energie.md
    referenced_by:
      - design/gdd/energie.md
    variables:
      - REVENU_NIVEAU
      - niveau
    output_range: [0, 30]
    expression: "sum of REVENU_NIVEAU[level(n)] over nodes owned by the faction"
    notes: "Computed each time, never stored. Paid at the start of the faction's turn."
    added: 2026-10-30
    revised: ""
  - name: crediter
    status: active
    source: design/gdd/energie.md
    referenced_by:
      - design/gdd/energie.md
    variables:
      - avant
      - montant
      - ENERGIE_MAX
    output_range: [0, 99]
    expression: "apres = min(avant + montant, ENERGIE_MAX); surplus_perdu = avant + montant - apres"
    notes: "Surplus is lost, never refused. Only the turn-start income credits at MVP."
    added: 2026-10-30
    revised: ""
  - name: owner_of_tile
    status: active
    source: design/gdd/noeuds.md
    referenced_by:
      - design/gdd/noeuds.md
    variables:
      - RAYON_NIVEAU
      - niveau
      - distance
    output_range: [0, 3]
    expression: "node tile -> node owner; else nearest owned node in range (Chebyshev <= RAYON_NIVEAU[level]); tie keeps current owner, else lowest node id; none in range -> neutral"
    notes: "Only system 11 writes tile owners. Full recompute after any node write; fixed point."
    added: 2026-10-30
    revised: ""
  - name: territory_size
    status: active
    source: design/gdd/noeuds.md
    referenced_by:
      - design/gdd/noeuds.md
    variables:
      - x
      - y
      - R
      - W
      - H
    output_range: [4, 49]
    expression: "(min(x+R, W-1) - max(x-R, 0) + 1) * (min(y+R, H-1) - max(y-R, 0) + 1)"
    notes: "Tiles of one isolated node clipped at the borders, before overlap."
    added: 2026-10-30
    revised: ""
  - name: defense_eff
    status: active
    source: design/gdd/combat.md
    referenced_by:
      - design/gdd/combat.md
    variables:
      - DEF
      - DEF_PER_TILE_CLASS
      - tile_class
    output_range: [0, 4]
    expression: "DEF + DEF_PER_TILE_CLASS * tile_class"
    notes: "Defence of the defender's type plus the tile class of the defender's tile."
    added: 2026-10-30
    revised: ""
  - name: damage
    status: active
    source: design/gdd/combat.md
    referenced_by:
      - design/gdd/combat.md
    variables:
      - DMG_SCALE
      - DEF_BASE
      - ATQ
      - PV_att
      - PV_max_att
      - defense_eff
    output_range: [0, 6]
    expression: "0 if ATQ = 0 else max(DMG_MIN, (DMG_SCALE*DEF_BASE*ATQ*PV_att) // (PV_max_att*(DEF_BASE+defense_eff)))"
    notes: "Integer division. Proportional to the striker's remaining HP. Deterministic, no draw. Retaliation uses the same formula."
    added: 2026-10-30
    revised: ""
  - name: sight_field
    status: active
    source: design/gdd/brouillard-vision.md
    referenced_by:
      - design/gdd/brouillard-vision.md
    variables:
      - rayon
      - terrain
      - bloquee
    output_range: [1, 121]
    expression: "T visible from V iff cheb(V,T) <= rayon + [V on mountain] and not blocked(V,T)"
    notes: "blocked() is the map GDD formula 3 (Bresenham, only mountains block). Node sources use max(2, territory radius). Union over a faction's sources."
    added: 2026-10-30
    revised: ""
  - name: prix_reveil
    status: active
    source: design/gdd/reveil-drones.md
    referenced_by:
      - design/gdd/reveil-drones.md
      - design/gdd/energie.md
    variables:
      - REVEIL_PRIX
      - type
    output_range: [4, 8]
    expression: "REVEIL_PRIX[type]"
    notes: "Fixed per type for the whole match; read through prix_reveil so that system 12 may add a modifier later. Debited by depenser (10)."
    added: 2026-10-30
    revised: ""
  - name: couleur_tuile
    status: active
    source: design/gdd/recoloration-monde.md
    referenced_by:
      - design/gdd/recoloration-monde.md
      - design/gdd/brouillard-vision.md
    variables:
      - proprio_reel
      - octet1_P
      - visibilite
    output_range: [0, 3]
    expression: "VISIBLE: proprio_reel; EXPLOREE: octet1_P; INCONNUE: 0"
    notes: "Byte of tile colour for the reference faction; written only by system 15."
    added: 2026-10-30
    revised: ""
  - name: duree_onde_recoloration
    status: active
    source: design/gdd/recoloration-monde.md
    referenced_by:
      - design/gdd/recoloration-monde.md
      - design/gdd/noeuds.md
    variables:
      - T_ANNEAU
      - T_FONDU
      - K_MAX
      - T_TOTAL_MAX
      - k_max
    output_range: [400, 1000]
    expression: "min(K_MAX, k_max) * min(T_ANNEAU, (T_TOTAL_MAX - T_FONDU) div K_MAX) + T_FONDU"
    notes: "Presentation only; radius 1/2/3 gives 600/800/1000 ms."
    added: 2026-10-30
    revised: ""
  - name: saturation_fondu
    status: active
    source: design/gdd/recoloration-monde.md
    referenced_by:
      - design/gdd/recoloration-monde.md
    variables:
      - u
      - D
    output_range: [0, 1000]
    expression: "(1000 * u) div D (grey to faction); mirrored for faction to grey; two halves for faction to faction"
    notes: "Thousandths; hues never mix."
    added: 2026-10-30
    revised: ""
  - name: fragment_suivant
    status: active
    source: design/gdd/ruines-fragments.md
    referenced_by:
      - design/gdd/ruines-fragments.md
      - design/gdd/profil-donnees-meta.md
    variables:
      - P_f
      - C_f
      - J_f
    output_range: [1, 12]
    expression: "min(P_f minus (C_f union J_f))"
    notes: "Fixed chronicle order; no randomness."
    added: 2026-10-30
    revised: ""
  - name: zone_ruine
    status: active
    source: design/gdd/ruines-fragments.md
    referenced_by:
      - design/gdd/ruines-fragments.md
      - design/gdd/recoloration-monde.md
      - design/gdd/noeuds.md
    variables:
      - RAYON_ZONE_RUINE
    output_range: [9, 25]
    expression: "(2 * RAYON_ZONE_RUINE + 1)^2 clipped to the grid"
    notes: "Only neutral non-node tiles are written."
    added: 2026-10-30
    revised: ""
  - name: score_ruine
    status: active
    source: design/gdd/ruines-fragments.md
    referenced_by:
      - design/gdd/ruines-fragments.md
      - design/gdd/tours-conditions-victoire.md
    variables:
      - w_f
      - w_t
      - n_tuiles
    output_range: [60, 85]
    expression: "w_f + n_tuiles * w_t"
    notes: "Not displayed before the read; excluded from the turn-30 comparison."
    added: 2026-10-30
    revised: ""
  - name: score_ia_couple
    status: active
    source: design/gdd/ia-ennemie.md
    referenced_by:
      - design/gdd/ia-ennemie.md
    variables:
      - w_deg
      - w_letal
      - w_perte
      - w_danger
      - w_noeud
      - w_raid
      - w_laisse
      - w_prog
    output_range: [-1000, 1000]
    expression: "w_deg*D_inf + w_letal*letal - w_perte*Riposte - w_danger*Exposition + w_noeud*Valeur_noeud + w_raid*raideur - w_laisse*max(0, dist_poste - LEASH) + w_prog*gain_distance"
    notes: "Deterministic greedy score; weights are data in assets/data/ai.*"
    added: 2026-10-30
    revised: ""
  - name: draw
    status: active
    source: design/gdd/modele-etat-partie.md
    referenced_by:
      - design/gdd/modele-etat-partie.md
    variables:
      - seed
      - counter
      - n
    output_range: [0, 65535]
    expression: "hash32(seed, counter) mod n, then counter += 1"
    notes: "Only source of randomness in a match. n in 1..MAX_DRAW_N. Hash fixed by ADR."
    added: 2026-10-29
    revised: ""
  - name: stored_intentions_max
    status: active
    source: design/gdd/modele-etat-partie.md
    referenced_by:
      - design/gdd/modele-etat-partie.md
    variables:
      - INTENT_CAP
      - INTENT_RETENTION_TURNS
    output_range: [0, 120]
    expression: "INTENT_CAP * INTENT_RETENTION_TURNS"
    added: 2026-10-29
    revised: ""
  - name: next_fragment
    status: active
    source: design/gdd/profil-donnees-meta.md
    referenced_by:
      - design/gdd/profil-donnees-meta.md
      - design/gdd/modele-etat-partie.md
    variables:
      - P_f
      - C_f
    output_range: [1, 12]
    expression: "min(P_f minus C_f), or NONE when P_f is a subset of C_f"
    notes: "Stable fragment ID the next ruin of faction f gives. Never stored. Read by Ruins (13)."
    added: 2026-10-29
    revised: ""
  - name: chronicle_progress
    status: active
    source: design/gdd/profil-donnees-meta.md
    referenced_by:
      - design/gdd/profil-donnees-meta.md
    variables:
      - C_f
      - P_f
    output_range: [0, 12]
    expression: "size of (C_f intersect P_f)"
    notes: "Retired IDs excluded. Chronicle (14) compares it to its 4/12 unlock threshold."
    added: 2026-10-29
    revised: ""
  - name: t_cmd_max
    status: active
    source: design/gdd/commandes-evenements.md
    referenced_by:
      - design/gdd/commandes-evenements.md
      - design/gdd/modele-etat-partie.md
    variables:
      - T_ai
      - f_cmd
      - C
      - t_clone
    output_range: [0, 2000]
    expression: "T_ai * f_cmd / C - t_clone (ms)"
    notes: "Budget to validate+apply one command for the AI (9). Provisional 0.3 ms; measure on the reference phone."
    added: 2026-10-29
    revised: ""
  - name: chebyshev
    status: active
    source: design/gdd/carte-tuiles-terrain.md
    referenced_by:
      - design/gdd/carte-tuiles-terrain.md
    variables:
      - x1
      - y1
      - x2
      - y2
    output_range: [0, 15]
    expression: "max(abs(x1 - x2), abs(y1 - y2))"
    notes: "Distance on the 8-neighbour square grid. Used for ranges (6, 8), sight radius (5), map rules."
    added: 2026-10-29
    revised: ""
  - name: path_cost
    status: active
    source: design/gdd/carte-tuiles-terrain.md
    referenced_by:
      - design/gdd/carte-tuiles-terrain.md
      - design/gdd/commandes-evenements.md
    variables:
      - c(t)
      - MP_left
      - MP_max
    output_range: [1, 765]
    expression: "sum of entry costs (plain 1, forest 2, mountain 3, water impassable); reachable if cost <= MP_left, or one step with full MP (floor rule)"
    notes: "Validates DÉPLACER (23). MP owned by units (6)."
    added: 2026-10-29
    revised: ""
  - name: final_score
    status: active
    source: design/gdd/tours-conditions-victoire.md
    referenced_by:
      - design/gdd/tours-conditions-victoire.md
      - design/gdd/profil-donnees-meta.md
    variables:
      - T
      - N
      - sum_L
      - P
      - U
      - F
      - D
    output_range: [0, 776]
    expression: "w_t*T + w_n*N + w_l*sum_L + w_p*P + w_u*min(U, U_cap) + w_f*F + D"
    notes: "Start weights 1, 8, 4, 10, 2, 60; U_cap 20. F = ruins read this match. D = 8 per turn left on domination. Best score submitted to the profile (22)."
    added: 2026-10-29
    revised: ""
  - name: loss_bound
    status: active
    source: design/gdd/sauvegarde-automatique.md
    referenced_by:
      - design/gdd/sauvegarde-automatique.md
    variables:
      - t_write
      - t_action_min
    output_range: [1, 10]
    expression: "1 + ceil(t_write / t_action_min)"
    notes: "Most player actions a kill can lose. Provisional t_action_min 250 ms gives 2. Never a fragment already shown (save rule 10)."
    added: 2026-10-29
    revised: ""

